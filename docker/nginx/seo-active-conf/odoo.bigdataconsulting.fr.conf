server {
    listen 80;
    server_name odoo.bigdataconsulting.fr;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name odoo.bigdataconsulting.fr;
    ssl_certificate /etc/letsencrypt/live/sage.bigdataconsulting.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sage.bigdataconsulting.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://192.168.1.127;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
